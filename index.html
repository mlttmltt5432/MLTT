<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dcecf4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="苗栗太太">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>苗栗太太｜店家整理器</title>
<style>
:root{--blue:#dcecf4;--ink:#304654;--cream:#fffaf2;--tan:#a77c55}
*{box-sizing:border-box}body{margin:0;padding:22px 15px 40px;background:#f4f7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:720px;margin:auto}.brand{font-size:12px;letter-spacing:.2em;color:#8095a0}.panel{background:white;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 8px 28px #3046540c}
h1{font-size:24px;margin:8px 0}.intro{color:#71818a;line-height:1.7;font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #d9e1e5;border-radius:11px;font:16px inherit;background:white;color:#304654}textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:12px;background:#344f60;color:white;font-weight:700;font-size:15px;padding:13px 16px;margin-top:12px;width:100%}.secondary{background:#8aa3b0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small{color:#829098;line-height:1.6;display:block;margin-top:8px}.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}.days input{font-size:14px;padding:10px}
#poster{background:#dcecf4;border-radius:18px;padding:20px;color:#304654;margin-top:14px}
#poster h2{font-size:23px;margin:0 0 14px}#poster p{white-space:pre-wrap;line-height:1.7;margin:8px 0}.hours{background:#fffaf2;border-radius:12px;padding:10px 14px;margin-top:10px}
#output{white-space:pre-wrap;line-height:1.8;background:#fffaf2;padding:14px;border-radius:12px;font-size:14px}
@media(min-width:560px){.days{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main>
<div class="brand">MIAOLI TAITAI</div>
<section class="panel">
<h1>苗栗太太｜店家整理器</h1>
<p class="intro">免費版・不需付費 API。貼上地圖網址後，先開啟店家公開頁面，再把查到的資料填入；系統會自動排版、產生貼文並輸出 PNG。</p>
<label for="map">Google Maps 網址</label><input id="map" placeholder="貼上 https://maps.app.goo.gl/..." inputmode="url">
<div class="row"><button id="openMap">開啟店家地圖</button><button class="secondary" id="searchWeb">搜尋店家資料</button></div>
<small>免費靜態網頁無法可靠地直接讀取 Google Maps 動態頁面；不會假裝已取得資料，也不會亂填營業時間。</small>
</section>
<section class="panel">
<label for="name">店家名稱</label><input id="name" placeholder="例如：小樹的家咖啡民宿">
<label for="address">地址</label><input id="address" placeholder="縣市、鄉鎮、路名與門牌">
<label>營業時間（逐日填寫）</label><div class="days" id="days"></div>
<label for="note">備註</label><textarea id="note" placeholder="例如：營業時間如有異動，請以店家公告為準。"></textarea>
<label for="tags">Hashtag（5 個）</label><input id="tags" value="#苗栗美食 #苗栗景點 #苗栗太太 #在地推薦 #店家資訊">
<button id="make">產生介紹文字與圖片</button>
</section>
<section class="panel" id="result" hidden>
<h2>文字貼文</h2><div id="output"></div><button id="copy">複製貼文</button>
<h2 style="margin-top:24px">圖片預覽</h2><div id="poster"><h2 id="pname"></h2><p id="paddr"></p><div class="hours"><strong>🕒 營業時間</strong><p id="phours"></p></div><p id="pnote"></p></div>
<button class="secondary" id="png">下載 PNG 圖片</button>
</section>
</main>
<script>
const week=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const days=document.querySelector('#days');
week.forEach((d,i)=>{let w=document.createElement('div');w.innerHTML=`<label style="margin:0 0 5px">${d}</label><input id="d${i}" placeholder="例如 11:00–20:00 / 公休">`;days.append(w)});
const val=id=>document.getElementById(id).value.trim();
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hours(){return week.map((d,i)=>`${d}｜${val('d'+i)||'待確認'}`).join('\n')}
function searchQuery(){return [val('name'),val('address'),val('map')].filter(Boolean).join(' ')}
document.querySelector('#openMap').onclick=()=>{if(!val('map'))return alert('請先貼上 Google Maps 網址');window.open(val('map'),'_blank','noopener')};
document.querySelector('#searchWeb').onclick=()=>{let q=searchQuery();if(!q)return alert('請先貼上地圖網址或輸入店名');window.open('https://www.google.com/search?q='+encodeURIComponent(q+' 營業時間 地址'),'_blank','noopener')};
document.querySelector('#make').onclick=()=>{
 if(!val('name'))return alert('請填寫店家名稱');
 let text=`⭐️ ${val('name')}\n\n📍 ${val('address')||'地址待確認'}\n\n🕒 營業時間\n${hours()}\n\n⚠️ ${val('note')||'店家資訊如有異動，請以店家公告為準。'}\n\n${val('tags')}`;
 document.querySelector('#output').textContent=text;
 document.querySelector('#pname').textContent=val('name');
 document.querySelector('#paddr').textContent='📍 '+(val('address')||'地址待確認');
 document.querySelector('#phours').textContent=hours();
 document.querySelector('#pnote').textContent='⚠️ '+(val('note')||'店家資訊如有異動，請以店家公告為準。');
 document.querySelector('#result').hidden=false;
};
document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#output').textContent);document.querySelector('#copy').textContent='已複製！'};
document.querySelector('#png').onclick=async()=>{
 const poster=document.querySelector('#poster');const canvas=document.createElement('canvas');const scale=2;canvas.width=poster.offsetWidth*scale;canvas.height=poster.offsetHeight*scale;
 const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#dcecf4';ctx.fillRect(0,0,poster.offsetWidth,poster.offsetHeight);
 ctx.fillStyle='#304654';ctx.font='bold 23px sans-serif';ctx.fillText(val('name'),18,36);
 ctx.font='16px sans-serif';let y=70;const lines=[ '📍 '+(val('address')||'地址待確認'), '🕒 營業時間', ...hours().split('\n'), '⚠️ '+(val('note')||'店家資訊如有異動，請以店家公告為準。') ];
 for(const line of lines){ctx.fillText(line,18,y);y+=27;}
 canvas.height=Math.max(canvas.height,(y+30)*scale);const a=document.createElement('a');a.download='苗栗太太_店家介紹.png';a.href=canvas.toDataURL('image/png');a.click();
};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
